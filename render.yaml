# Publicação do Agro Sense no Render (https://render.com) — plano gratuito.
# Uso: Render → New → Blueprint → escolher este repositório → Apply.
# Cria dois recursos: o banco PostgreSQL e um serviço web que roda a API
# e entrega o site (build do frontend) no mesmo endereço.
# Passo a passo completo em DEPLOY.md.

databases:
  - name: agro-sense-db
    plan: free
    databaseName: agrosense
    user: agrosense
    postgresMajorVersion: "16"

services:
  - type: web
    name: agro-sense
    runtime: node
    plan: free
    # Compila o frontend (que vai chamar a API em /api, no mesmo endereço) e depois o backend.
    buildCommand: >-
      npm ci --prefix frontend &&
      VITE_API_URL=/api npm run build --prefix frontend &&
      npm ci --prefix backend &&
      npm run build --prefix backend
    # Aplica as migrations, popula o banco só se estiver vazio e sobe a API, que também serve o site.
    startCommand: npm run start:prod --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Sao_Paulo
      - key: FRONTEND_DIST
        value: ../frontend/dist
      - key: DATABASE_URL
        fromDatabase:
          name: agro-sense-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
