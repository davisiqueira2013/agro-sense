# Publicação do Agro Sense no Render (https://render.com) — plano gratuito.
# Uso: Render → New → Blueprint → escolher este repositório → Apply.
# Cria três recursos: o banco PostgreSQL, a API (Node.js) e o frontend (site estático).
# Passo a passo completo em DEPLOY.md.

databases:
  - name: agro-sense-db
    plan: free
    databaseName: agrosense
    user: agrosense
    postgresMajorVersion: "16"

services:
  - type: web
    name: agro-sense-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    # Aplica as migrations, popula o banco só se estiver vazio e sobe a API.
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Sao_Paulo
      - key: DATABASE_URL
        fromDatabase:
          name: agro-sense-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: agro-sense-web
          property: host

  - type: web
    name: agro-sense-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: agro-sense-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
